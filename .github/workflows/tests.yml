name: tests

# Runs on every push and every pull request.
on:
  push:
  pull_request:

# The workflow only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false # if one Python version fails, still run the other
      matrix:
        python-version: ["3.10", "3.13"] # oldest supported + a recent one

    # A throwaway PostgreSQL server, started as a container next to the tests.
    # (GitHub runs the container for you; you do not need Docker installed.)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres # CI-only password for a server that is deleted after the run
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # The tests read these to find the server above. Same names the tool uses.
    env:
      YOURTOOL_INTEGRATION: "1"
      YOURTOOL_DB_HOST: localhost
      YOURTOOL_DB_PORT: "5432"
      YOURTOOL_DB_USER: postgres
      YOURTOOL_DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # pg_dump must be the same version as the server or newer.
      - name: Install PostgreSQL 16 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          pg_dump --version
          psql --version

      - name: Install the project and test tools
        run: pip install -e ".[dev]"

      - name: Run the tests
        run: pytest --cov=yourtool --cov-report=term-missing
