# Copy to config.yaml and edit. Do NOT commit real passwords.
# Prefer setting the password with: YOURTOOL_DB_PASSWORD
database:
  type: postgres        # or: mysql (also works with MariaDB)
  host: localhost
  # port: 5432         # optional: 5432 for postgres, 3306 for mysql
  port: 5432
  user: admin
  name: collegegrades
  # password: change-me      # discouraged; use the env var instead

storage:
  type: local
  path: ./backups

# Optional. Uncomment to also write a log file (off by default).
# logging:
#   file: ./yourtool.log

# Optional. gzip makes plain-text backups (MySQL/MariaDB) several times smaller.
# PostgreSQL backups are already compressed, so it saves little there.
# backup:
#   compression: gzip

# Optional. Rules for `yourtool prune`, which deletes old backups (and asks first).
# A backup is kept if ANY rule keeps it; the newest backup is never deleted.
# retention:
#   keep_last: 7       # the 7 most recent backups
#   keep_daily: 7      # plus the newest of each of the last 7 days that have a backup
#   keep_weekly: 4     # plus the newest of each of the last 4 weeks
#   keep_monthly: 6    # plus the newest of each of the last 6 months

# Optional. Run jobs on a schedule with `yourtool schedule run --config config.yaml`.
# (See the README, "Scheduling". The database settings above are used by every job.)
# schedule:
#   timezone: Europe/Berlin          # default: UTC
#   jobs:
#     - name: nightly-backup
#       command: backup              # backup | prune | verify
#       cron: "0 2 * * *"            # every day at 02:00
#     - name: weekly-prune
#       command: prune
#       cron: "30 3 * * sun"         # Sundays at 03:30
#       delete_without_asking: true  # required for prune: no one is there to confirm
#       with: {keep_last: 7, keep_weekly: 4}
#     - name: daily-check
#       command: verify
#       cron: "@daily"
